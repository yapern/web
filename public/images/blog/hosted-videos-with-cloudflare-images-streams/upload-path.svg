<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" fill="#263238">
<text x="28" y="38" font-size="21" fill="#263238" font-weight="600" text-anchor="start">Images go through the Worker</text>
<path d="M122 102H350" fill="none" stroke="#7654ba" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M415 102H640" fill="none" stroke="#7654ba" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="68" y="82" width="48" height="36" rx="3" fill="#f7f4ec" stroke="#263238" stroke-width="2"/><path d="M68 92h48" stroke="#263238"/><circle cx="75" cy="87" r="1.5" fill="#263238"/><path d="M80 110l8-9 7 6 5-3 6 6z" fill="#b5a1d2"/>
<path d="M367 79h34l13 23-13 23h-34l-13-23z" fill="#f7f4ec" stroke="#263238" stroke-width="2"/>
<text x="384" y="108" font-size="19" fill="#263238" font-weight="600" text-anchor="middle">W</text>
<path d="M648 87v30c0 13 48 13 48 0v-30" fill="#f7f4ec" stroke="#263238" stroke-width="2"/><ellipse cx="672" cy="87" rx="24" ry="9" fill="#f7f4ec" stroke="#263238" stroke-width="2"/>
<text x="672" y="112" font-size="15" fill="#263238" font-weight="600" text-anchor="middle">R2</text>
<text x="92" y="156" font-size="17" fill="#263238" font-weight="500" text-anchor="middle">Browser</text>
<text x="384" y="156" font-size="17" fill="#263238" font-weight="500" text-anchor="middle">Worker</text>
<text x="672" y="156" font-size="17" fill="#263238" font-weight="500" text-anchor="middle">Images</text>
