<path d="M414 264L648 330" fill="none" stroke="#263238" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="214" y="280" font-size="15" fill="#526169" font-weight="400" text-anchor="middle">reservation + URL</text>
<text x="560" y="280" font-size="15" fill="#526169" font-weight="400" text-anchor="middle">provision upload</text>
