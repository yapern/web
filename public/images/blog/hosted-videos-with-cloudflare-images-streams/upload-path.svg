<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" role="img" aria-labelledby="title desc"><title id="title">Two uploads, different paths</title><desc id="desc">Images pass through a Worker to R2. Video control requests go through the Worker, but the file goes directly from the browser to Stream. The Worker stores its identity in D1.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="context-stroke"/></marker></defs>
