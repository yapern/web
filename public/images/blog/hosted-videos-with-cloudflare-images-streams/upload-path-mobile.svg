<svg xmlns="http://www.w3.org/2000/svg" width="380" height="580" viewBox="0 0 380 580" role="img" aria-labelledby="title desc"><title id="title">Images through the Worker, video directly to Stream</title><desc id="desc">The upper path carries image bytes through the Worker to R2. Below it, a direct video transfer bypasses the Worker; dashed paths provision the upload and D1 retains the asset identity.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="context-stroke"/></marker></defs>
