<svg xmlns="http://www.w3.org/2000/svg" width="400" height="660" viewBox="0 0 400 660" role="img" aria-labelledby="title desc">
<title id="title">Airborne U.S.-bound flights</title><desc id="desc">Snapshots of airborne flights worldwide headed for U.S. airports, on a common scale: 4,042 at 3:54 p.m. Eastern; 1,000 at 5:55 p.m.; fewer than 400 at 8 p.m.; 336 at 8:29 p.m. The nationwide ground stop lifted at 8:15 p.m. The less-than-400 bar shows an upper bound, not an exact measurement.</desc>
<defs>
  <marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto-start-reverse"><path d="M0 0L6 3L0 6" fill="none" stroke="#256581" stroke-width="1.5"/></marker>
  <pattern id="bound" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-2 2L2 -2M0 8L8 0M6 10L10 6" stroke="#256581" stroke-width="2"/></pattern>
</defs>
<rect width="400" height="660" rx="4" fill="#f7f4ec"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#26343f">
<metadata>Source: Flightradar24 live coverage, November 13–14, 2026. https://www.flightradar24.com/blog/live/nationwide-ground-stop-issued-for-united-states/</metadata>
<text x="24" y="38" font-size="23" fill="#26343f" font-weight="700" text-anchor="start">Airborne U.S.-bound flights</text>
<text x="24" y="66" font-size="17" fill="#52606a" font-weight="400" text-anchor="start">Worldwide · Nov. 13, 2026 · Eastern</text>
<text x="24" y="92" font-size="17" fill="#52606a" font-weight="400" text-anchor="start">All bars share the same scale.</text>
<text x="24" y="146" font-size="21" fill="#26343f" font-weight="700" text-anchor="start">3:54 p.m.</text>
<text x="376" y="146" font-size="25" fill="#26343f" font-weight="700" text-anchor="end">4,042</text>
<rect x="24" y="161" width="352" height="27" fill="#e3e6e2" rx="2"/>
<rect x="24" y="161" width="352.00" height="27" fill="#256581" rx="2"/>
<text x="24" y="212" font-size="17" fill="#52606a" font-weight="400" text-anchor="start">Ground stop begins</text>
<text x="24" y="246" font-size="21" fill="#26343f" font-weight="700" text-anchor="start">5:55 p.m.</text>
<text x="376" y="246" font-size="25" fill="#26343f" font-weight="700" text-anchor="end">1,000</text>
<rect x="24" y="261" width="352" height="27" fill="#e3e6e2" rx="2"/>
<rect x="24" y="261" width="87.09" height="27" fill="#256581" rx="2"/>
<text x="24" y="346" font-size="21" fill="#26343f" font-weight="700" text-anchor="start">8:00 p.m.</text>
<text x="376" y="346" font-size="25" fill="#26343f" font-weight="700" text-anchor="end">&lt;400</text>
<rect x="24" y="361" width="352" height="27" fill="#e3e6e2" rx="2"/>
<rect x="24" y="361" width="34.83" height="27" fill="url(#bound)" rx="2"/>
<text x="24" y="412" font-size="17" fill="#52606a" font-weight="400" text-anchor="start">Hatched bar = upper bound</text>
<text x="24" y="502" font-size="21" fill="#26343f" font-weight="700" text-anchor="start">8:29 p.m.</text>
<text x="376" y="502" font-size="25" fill="#26343f" font-weight="700" text-anchor="end">336</text>
<rect x="24" y="517" width="352" height="27" fill="#e3e6e2" rx="2"/>
<rect x="24" y="517" width="29.26" height="27" fill="#256581" rx="2"/>
<path d="M24 445H376" fill="none" stroke="#52606a" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 6"/>
<rect x="64" y="432" width="273" height="25" fill="#f7f4ec"/>
<text x="200" y="451" font-size="19" fill="#26343f" font-weight="700" text-anchor="middle">8:15 p.m. · Stop lifted</text>
<text x="24" y="588" font-size="17" fill="#52606a" font-weight="400" text-anchor="start">Lowest count came after reopening.</text>
<text x="24" y="614" font-size="17" fill="#52606a" font-weight="400" text-anchor="start">Snapshots, not one tracked group.</text>
<text x="24" y="643" font-size="16" fill="#52606a" font-weight="400" text-anchor="start">Source: Flightradar24 live coverage.</text>
</g></svg>
