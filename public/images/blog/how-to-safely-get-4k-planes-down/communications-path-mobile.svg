<text x="200" y="559" font-size="17" fill="#256581" font-weight="400" text-anchor="middle">Radio link</text>
<text x="294" y="632" font-size="18" fill="#26343f" font-weight="400" text-anchor="middle">Aircraft</text>
</g></svg>
