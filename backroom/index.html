<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#090d17" />
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://yapern.com/backroom/" />
    <link rel="icon" href="/images/favicon.png" type="image/png" />
    <link rel="stylesheet" href="/yapern.css" />
    <title>Backroom · Yapern</title>
  </head>
  <body class="login-body">
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header shell">
      <a class="brand" href="/" aria-label="Yapern home"><img src="/images/logo.png" alt="" width="36" height="36" />yapern<span class="brand-dot">.</span></a>
      <a class="login-home" href="/">Back to Yapern</a>
    </header>
    <main id="main" class="backroom-main shell">
      <section id="backroom-access" class="backroom-access" role="status">
        <h1>Backroom</h1>
        <p id="backroom-status">Checking access…</p>
        <a id="backroom-login" class="login-home" href="/login/" hidden>Log in</a>
        <noscript><p>Enable JavaScript to access the backroom.</p></noscript>
      </section>
      <div id="backroom-layout" class="backroom-layout" hidden>
        <aside class="backroom-navigation">
          <h1>Backroom</h1>
          <nav id="backroom-menu" aria-label="Admin sections">
            <ul>
              <li><a class="detail-nav-link" href="#users" aria-current="page">Users</a></li>
              <li><a class="detail-nav-link" href="#sub-yaps">Sub-Yaps</a></li>
              <li><a class="detail-nav-link" href="#messages">Messages</a></li>
              <li><a class="detail-nav-link" href="#replies">Replies</a></li>
              <li><a class="detail-nav-link" href="#email">Email</a></li>
            </ul>
          </nav>
        </aside>
        <section id="backroom-content" aria-label="Users">
          <div id="backroom-users-view" class="backroom-users-view" hidden>
            <h2 id="backroom-users-title">Users</h2>
            <form id="backroom-users-search-form" class="backroom-users-search" role="search">
              <label class="create-field" for="backroom-users-search">
                <span>Search users</span>
                <input id="backroom-users-search" name="q" type="search" placeholder="Name, email, or ID" maxlength="100" autocomplete="off" />
              </label>
              <button id="backroom-users-search-submit" class="backroom-user-button" type="submit">Search</button>
            </form>
            <p id="backroom-users-status" class="backroom-users-status" role="status"></p>
            <p id="backroom-users-error" class="create-error" role="alert"></p>
            <button id="backroom-users-retry" class="backroom-user-button" type="button" hidden>Try again</button>
            <div id="backroom-users-table" class="backroom-users-table" role="region" aria-labelledby="backroom-users-title" tabindex="0" aria-busy="false" hidden>
              <table aria-labelledby="backroom-users-title">
                <thead><tr><th scope="col">User</th><th scope="col">Email</th><th scope="col">Joined</th></tr></thead>
                <tbody id="backroom-users-rows"></tbody>
              </table>
            </div>
            <nav id="backroom-users-pagination" class="backroom-users-pagination" aria-label="User list pages" hidden>
              <button id="backroom-users-previous" class="backroom-user-button" type="button" disabled>Previous</button>
              <button id="backroom-users-next" class="backroom-user-button" type="button" disabled>Next</button>
            </nav>
          </div>
          <div id="backroom-email-view" class="backroom-email-view" hidden>
            <h2 id="backroom-email-title">Test marketing email</h2>
            <form id="backroom-email-form" class="create-form backroom-email-form" aria-labelledby="backroom-email-title" aria-busy="false">
              <label class="create-field" for="backroom-email-to">
                <span>To</span>
                <input id="backroom-email-to" name="to" type="email" autocomplete="off" maxlength="254" value="oneone@gmail.com" required />
              </label>
              <label class="create-field" for="backroom-email-from">
                <span>From</span>
                <input id="backroom-email-from" name="from" type="email" autocomplete="off" maxlength="254" value="hello@yapern.com" aria-describedby="backroom-email-from-help" required />
                <span id="backroom-email-from-help" class="backroom-email-hint">Use an address on your verified sending domain.</span>
              </label>
              <label class="create-field" for="backroom-email-subj">
                <span>Subject</span>
                <input id="backroom-email-subj" name="subj" type="text" maxlength="998" required />
              </label>
              <label class="create-field" for="backroom-email-body">
                <span>Body</span>
                <textarea id="backroom-email-body" name="message" rows="8" maxlength="100000" required></textarea>
              </label>
              <button id="backroom-email-submit" class="button button-small" type="submit">Send test email</button>
              <p id="backroom-email-status" class="backroom-email-feedback" role="status"></p>
              <p id="backroom-email-error" class="create-error" role="alert"></p>
            </form>
          </div>
        </section>
        <aside class="backroom-details" aria-label="Details"></aside>
      </div>
    </main>
    <script type="module" src="/src/backroom.js"></script>
  </body>
</html>
